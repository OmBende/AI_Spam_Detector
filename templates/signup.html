<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up - AI Spam Detector</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
```

</head>

<body>

<div class="page-container">

```
<div class="auth-card">

    <div class="auth-logo">
        🛡️
    </div>

    <h1>
        AI Spam Detector
    </h1>

    <p class="auth-subtitle">
        Create your account
    </p>


    {% with messages = get_flashed_messages() %}

        {% if messages %}

            <div class="flash-message">

                {% for message in messages %}

                    {{ message }}

                {% endfor %}

            </div>

        {% endif %}

    {% endwith %}


    <form method="POST">

        <div class="auth-field">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required>

        </div>


        <div class="auth-field">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>

        </div>


        <div class="auth-field">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required>

        </div>


        <button
            type="submit"
            class="analyze-button">

            ✨ Create Account

        </button>

    </form>


    <p class="auth-switch">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </p>

</div>
```

</div>

</body>

</html>
